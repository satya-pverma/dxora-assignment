name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            requirements: requirements-dev.txt
          - os: windows-latest
            python: '3.13'
            requirements: requirements-tested.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-tested.txt
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest
